<script>
'use strict';
const data = JSON.parse(document.getElementById('data').textContent);
document.getElementById('sampling-note').textContent = `控制步曲线每4步平均，周期曲线每${data.cycle_group_size || 4}周期平均；末组保留剩余样本。拖选区间放大，各图可独立重置。`;
document.getElementById('title').textContent = data.experiment;
document.getElementById('overview').textContent = `${data.samples.toLocaleString()} 环境步 · ${data.cycle_count.toLocaleString()} 完整且未跌倒的周期`;

const blue = '#146a92', orange = '#b55a12', green = '#35715f';
const line = (label, column, color) => ({label, column, color});
const lane = (unit, ...series) => ({unit, series});
const specifications = [
  ['Reward 与前进速度', data.steps, '环境步', [
    lane('Reward', line('X Reward', 1, orange)),
    lane('m/s', line('实际前进速度', 2, blue)),
  ]],
  ['Reward 与转向速度', data.steps, '环境步', [
    lane('Reward', line('yaw Reward', 3, orange),
      ...(data.has_speed_delta ? [line('速度差 Reward', 8, green)] : [])),
    lane('rad/s', line('实际航向转速', 4, blue)),
  ]],
  ['总 Reward 与实际行走', data.steps, '环境步', [
    lane('Reward', line('总 Reward', 5, orange)),
    lane('m/s', line('实际前进速度', 2, blue), line('实际横向速度', 6, green)),
  ]],
  ['每步原始 gyro Z', data.steps, '环境步', [
    lane('rad/s', line('原始 gyro Z 四步均值', 7, orange)),
  ]],
  ['每周期平均转速', data.cycles, '周期', [
    lane('rad/s', line('实际净航向转速', 1, blue), line('周期平均 gyro Z', 2, orange)),
  ]],
];

const ns = 'http://www.w3.org/2000/svg';
function svgNode(parent, tag, attrs, text) {
  const node = document.createElementNS(ns, tag);
  for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
  if (text !== undefined) node.textContent = text;
  parent.append(node);
  return node;
}

function createChart([title, points, xUnit, lanes]) {
  const section = document.createElement('section');
  section.innerHTML = '<header><h2></h2><div class="controls"><button type="button" data-zoom="in">放大</button><button type="button" data-zoom="out">缩小</button><button type="button" data-zoom="reset">重置</button><output></output></div></header><div class="legend"></div>';
  section.querySelector('h2').textContent = title;
  const legend = section.querySelector('.legend');
  for (const {label, color} of lanes.flatMap(l => l.series)) {
    const labelNode = document.createElement('span');
    const swatch = document.createElement('i');
    swatch.className = 'swatch';
    swatch.style.background = color;
    labelNode.append(swatch, label);
    legend.append(labelNode);
  }
  const width = 980, height = lanes.length * 143 + 26, left = 67, right = 957;
  const graph = svgNode(section, 'svg', {viewBox:`0 0 ${width} ${height}`, role:'img', 'aria-label':title});
  document.getElementById('charts').append(section);
  const output = section.querySelector('output');
  const first = points[0]?.[0], last = points.at(-1)?.[0];
  let start = first, end = last, dragStart = null, selection = null;

  function draw() {
    graph.replaceChildren();
    const visible = points.filter(([x]) => x >= start && x <= end);
    output.textContent = visible.length ? `${start}–${end} ${xUnit}` : '当前范围无数据';
    section.querySelector('[data-zoom=in]').disabled = visible.length < 3;
    for (const key of ['out','reset']) section.querySelector(`[data-zoom=${key}]`).disabled = start === first && end === last;
    if (!visible.length) return;
    const sx = x => left + (x - start) / Math.max(1, end - start) * (right - left);
    lanes.forEach(({unit, series}, index) => {
      const top = 19 + index * 143, bottom = top + 105;
      const values = visible.flatMap(point => series.map(({column}) => point[column])).filter(Number.isFinite);
      svgNode(graph, 'text', {x:6,y:top-5}, unit);
      if (!values.length) {
        svgNode(graph, 'text', {x:left,y:top+32}, '缺少记录');
        return;
      }
      const low = Math.min(...values), high = Math.max(...values);
      const padding = Math.max(.001, (high - low) * .08);
      const lowBound = low - padding, highBound = high + padding;
      const sy = v => bottom - (v-lowBound)/(highBound-lowBound)*(bottom-top);
      for (let i = 0; i <= 4; i++) {
        const v = lowBound + i / 4 * (highBound-lowBound), y = sy(v);
        svgNode(graph, 'line', {x1:left,x2:right,y1:y,y2:y,stroke:'#e3e9ef'});
        svgNode(graph, 'text', {x:left-7,y:y+4,'text-anchor':'end'}, v.toFixed(3));
      }
      for (const {column,color} of series) {
        let path = '', hasPrevious = false;
        for (const point of visible) {
          const value = point[column];
          if (!Number.isFinite(value)) {hasPrevious = false;continue;}
          const x = sx(point[0]), y = sy(value);
          path += `${hasPrevious ? 'L' : 'M'}${x.toFixed(2)},${y.toFixed(2)}`;
          hasPrevious = true;
          if (visible.length <= 150) svgNode(graph, 'circle', {cx:x,cy:y,r:2,fill:color});
        }
        svgNode(graph, 'path', {d:path,fill:'none',stroke:color,'stroke-width':1.6});
      }
    });
    for (let i=0; i<=4; i++) {
      const x = Math.round(start + (end-start)*i/4);
      svgNode(graph,'text',{x:sx(x),y:height-18,'text-anchor':'middle'},x);
    }
    svgNode(graph,'text',{x:right,y:height-2,'text-anchor':'end'},xUnit);
  }

  function setRange(a, b) {
    if (first === undefined) return;
    a = Math.max(first,Math.round(a));
    b = Math.min(last,Math.round(b));
    if (a >= b || !points.some(([x])=>x>=a&&x<=b)) return;
    start = a;
    end = b;
    draw();
  }

  section.querySelectorAll('button').forEach(button => {
    button.onclick = () => {
      const center = (start+end)/2, span = end-start;
      if (button.dataset.zoom === 'reset') setRange(first,last);
      if (button.dataset.zoom === 'in') setRange(center-span/4,center+span/4);
      if (button.dataset.zoom === 'out') {
        if (span * 2 >= last - first - 1) setRange(first,last);
        else setRange(center-span,center+span);
      }
    };
  });
  function graphX(event) {
    const rect = graph.getBoundingClientRect();
    return Math.min(right,Math.max(left,(event.clientX-rect.left)*width/rect.width));
  }
  graph.onpointerdown = event => {
    if (event.button !== 0 || first === undefined || start === end) return;
    dragStart = graphX(event);
    selection = svgNode(graph,'rect',{x:dragStart,y:0,width:0,height:height-22,fill:'#146a92',opacity:.15});
    graph.setPointerCapture(event.pointerId);
  };
  graph.onpointermove = event => {
    if (dragStart === null) return;
    const x = graphX(event);
    selection.setAttribute('x',Math.min(x,dragStart));
    selection.setAttribute('width',Math.abs(x-dragStart));
  };
  graph.onpointerup = event => {
    if (dragStart === null) return;
    const a = dragStart, b = graphX(event);
    dragStart = null;
    selection.remove();
    if (Math.abs(a-b) < 7) return;
    const inverse = x => start + (x-left)/(right-left)*(end-start);
    setRange(inverse(Math.min(a,b)),inverse(Math.max(a,b)));
  };
  graph.onpointercancel = () => {dragStart = null;selection?.remove();};
  draw();
}
specifications.forEach(createChart);
</script>
</html>
